name: python-app1-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Shorten commit id
        run: echo "COMMITID=${GITHUB_SHA::6}" >> $GITHUB_ENV
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker.io/mehabadi/test:python-app1-${{ env.COMMITID }}
    outputs: 
      commit_id: ${{ env.COMMITID }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_arm64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Clone the repo
        uses: actions/checkout@v3
        
      - name: Modify values file
        run: |
          yq -i '.image.tag = "python-app1-${{needs.ci.outputs.commit_id}}"' charts/python-app1/values-dev.yaml
      - name: Commit values changes
        uses: EndBug/add-and-commit@v9
        with: 
          message: "Updates values-dev.yaml with commit ${{needs.ci.outputs.commit_id}}"
          pull: '--rebase --autostash'
      
      - name: Install Argo CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: ArgoCD login
        run: | 
          argocd login argocd-server.argocd \
          --insecure \
          --username admin \
          --password ${{ secrets.ARGOCD_PASSWORD }}

      - name: Ensure argocd repo and app are added
        run: |
          # Connect the argocd repo
          repo_url="https://github.com/mohsen-cicd-org-test/python-app1.git"
          argocd repo list | grep -q "$repo_url" || argocd repo add $repo_url

          # Add the argocd app
          argocd app list | grep -q "python-app1" || 
          argocd app create python-app1 \
          --repo $repo_url \
          --path charts/python-app1 \
          --dest-namespace python-app1-dev \
          --dest-server https://kubernetes.default.svc \
          --values values-dev.yaml \
          --revision main \
          --sync-policy manual \
          --sync-option CreateNamespace=true

      - name: ArgoCD sync app
        run: | 
          argocd app sync python-app1
          argocd app wait python-app1 --timeout 600
